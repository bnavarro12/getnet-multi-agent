# Load balancer for docker-compose.replicas.yml: spreads requests across the API replicas.
upstream api_replicas {
    server api:8000;          # Docker DNS returns one address per replica
}

server {
    listen 8000;
    location / {
        proxy_pass http://api_replicas;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
}
